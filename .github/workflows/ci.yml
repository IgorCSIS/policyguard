name: Tests and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  python:
    name: Python engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The engine has to work on whatever Python is already installed.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Appendix A conventions
        run: python tools/appendix_a_audit.py policyguard tools tests

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: The CLI runs on the shipped sample
        run: python -m policyguard --explain --stats

      - name: Alerts in the sample make --fail-on-alert exit non-zero
        run: |
          if python -m policyguard --fail-on-alert; then
            echo "Expected a non-zero exit because the sample contains alerts."
            exit 1
          fi

      - name: No dependency crept into the engine
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "The engine is meant to be standard library only."
            exit 1
          fi

  web:
    name: Demo and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: TypeScript tests
        run: npm test
        working-directory: web

      # The browser demo and the Python CLI have to say the same thing about
      # the same log. This fails the build if the port has drifted.
      - name: Parity between TypeScript and Python
        run: npm run parity
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: web/dist
          retention-days: 1

  # Deploying is kept out of the jobs above on purpose. Publishing depends on
  # a repository setting rather than on the code, so a repository with Pages
  # switched off should still show green tests: a red tick that means "the
  # owner has not clicked a button" teaches everyone to ignore red ticks.
  #
  # Note that the workflow token cannot switch Pages on by itself. Creating a
  # Pages site needs repository admin, which GITHUB_TOKEN does not have even
  # with pages: write, so actions/configure-pages fails with "Resource not
  # accessible by integration" until an admin sets Settings, Pages, Source to
  # GitHub Actions once. After that this job works on every push.
  deploy:
    name: Deploy the demo
    needs: [python, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
