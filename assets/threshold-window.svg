<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="Eight consecutive log lines from one address, showing the verdict handing over from the medium severity rule to the high severity one once the sliding window reaches five hits.">
  <title>Where the threshold trips</title>
  <desc>Lines 11 to 18 of samples/office-auth.log, all failed SSH passwords from 203.0.113.42. Every line matches both invalid_user_probe and brute_force_ssh. For the first four, brute_force_ssh is held below its threshold of five and invalid_user_probe is the verdict. From the fifth line the window is full, both rules are candidates, and brute_force_ssh wins the tie because the pack lists it first.</desc>
  <rect width="1200" height="496" rx="16" fill="#080D14"/>
  <rect x="0.5" y="0.5" width="1199" height="495" rx="15.5" fill="none" stroke="#223044"/>
  <text x="48" y="42" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F8FA">Eight lines that look the same. The fifth one changes the verdict.</text>
  <text x="48" y="66" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8CA0B8">samples/office-auth.log lines 11 to 18, all failed SSH passwords from 203.0.113.42. brute_force_ssh wants five hits from one source in a twenty event window.</text>
