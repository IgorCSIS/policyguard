  <text x="48" y="418" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8CA0B8">The dashed line is where the window reaches five. Before it, brute_force_ssh has matched the pattern four times and is held back.</text>
  <text x="48" y="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8CA0B8">After it both rules are candidates on every line. They carry the same priority, so the tie breaks on pack order, and brute_force_ssh is listed first.</text>
  <text x="48" y="462" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8CA0B8">The queue is per source. Another address failing passwords at the same time keeps its own count and never pushes this one over.</text>
